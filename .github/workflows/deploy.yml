name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Check Worker bindings and types
        run: |
          npm run worker:types:check
          npm run worker:typecheck
      - name: Verify hosted analyser configuration
        run: |
          if [ -z "$PLANAROUND_ANALYZER_URL" ]; then
            echo "PLANAROUND_ANALYZER_URL must be configured before deploying production."
            exit 1
          fi
        env:
          PLANAROUND_ANALYZER_URL: ${{ vars.PLANAROUND_ANALYZER_URL }}
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_ANALYZER_URL: ${{ vars.PLANAROUND_ANALYZER_URL }}
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
